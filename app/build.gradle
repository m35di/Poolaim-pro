plugins {
    id 'com.android.application'
}

android {
    namespace 'com.onyx.poolaim'
    compileSdk 34

    defaultConfig {
        applicationId "com.onyx.poolaim"
        minSdk 24
        targetSdk 33
        versionCode 3
        versionName "2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // بدون AppCompat
}
